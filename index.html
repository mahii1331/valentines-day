<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Be My Valentine 💖</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>

/* PAGE */
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;

  background-image: url("https://wallpapercave.com/wp/wp7351486.jpg");
  background-size: cover;
  background-position: center;

  font-family: 'Poppins', sans-serif;
}

/* OVERLAY */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(170,0,50,0.35);
  z-index:-1;
}

/* ❤️ HEART */
.container{
  width:480px;
  height:460px;

  background:
    radial-gradient(circle at top,#ffe6ef,#ffb6c9,#ff8fab);

  position:relative;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
  padding:40px;

  box-shadow:
    0 0 40px rgba(255,40,90,.6),
    0 25px 60px rgba(0,0,0,.4);

  /* HEART SHAPE */
  clip-path: path("M240 60 C200 0 0 40 0 200 C0 340 240 450 240 450 C240 450 480 340 480 200 C480 40 280 0 240 60 Z");

  border:5px solid #ff4d6d;

  animation:glow 2.5s infinite alternate;
}

/* GLOW */
@keyframes glow{
  from{
    box-shadow:
      0 0 25px rgba(255,80,130,.6),
      0 15px 40px rgba(0,0,0,.4);
  }
  to{
    box-shadow:
      0 0 50px rgba(255,120,170,.9),
      0 25px 60px rgba(0,0,0,.4);
  }
}

/* EMOJIS */
.emoji{
  font-size:32px;
  margin-bottom:12px;
}

/* TITLE */
h1{
  font-family:'Playfair Display', serif;
  font-size:36px;
  color:#b8002e;

  margin:10px 0 15px;
  line-height:1.3;

  text-shadow:1px 1px 4px rgba(255,255,255,.7);
}

/* SUBTEXT */
#msg{
  font-family:'Pacifico', cursive;
  font-size:20px;
  color:#7a001f;

  margin-bottom:25px;
  max-width:80%;
}

/* BUTTONS */
button{
  all: unset;
  box-sizing:border-box;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:14px 36px;
  font-size:18px;

  border-radius:40px;
  cursor:pointer;

  position:absolute;
  bottom:70px;

  transition:.25s;
}

/* YES */
#yesBtn{
  background:linear-gradient(to right,#2ecc71,#27ae60);
  color:white;

  left:90px;

  z-index:5;

  box-shadow:0 6px 15px rgba(0,0,0,.3);

  animation:pulse 1.5s infinite;
}

/* NO */
#noBtn{
  background:linear-gradient(to right,#ff4d6d,#ff1e56);
  color:white;

  right:90px;

  min-width:100px;
  height:46px;

  box-shadow:0 6px 15px rgba(0,0,0,.3);
}

/* PULSE */
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

/* SHAKE */
@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  50%{transform:translateX(6px);}
  75%{transform:translateX(-6px);}
  100%{transform:translateX(0);}
}

/* RESULT */
#result{
  position:fixed;
  inset:0;

  background:
    radial-gradient(circle,#ffd6e6,#ff8fab,#ff4d6d);

  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  text-align:center;
  padding:20px;
}

#result h2{
  color:white;
  font-size:40px;
  text-shadow:2px 2px 6px rgba(0,0,0,.4);
}

#result p{
  font-size:22px;
  color:#fff0f6;
}

.hearts{
  font-size:45px;
  margin-top:15px;
  animation:float 2s infinite alternate;
}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-18px);}
}

</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<iframe
  width="0"
  height="0"
  src="https://www.youtube.com/embed/2Vv-BfVoq4g?start=21&autoplay=1&loop=1&playlist=2Vv-BfVoq4g"
  frameborder="0"
  allow="autoplay"
></iframe>

<!-- ❤️ HEART CARD -->
<div class="container" id="card">

  <div class="emoji">🥺 💖 👉 👈</div>

  <h1>Will you be my Valentine,<br>Priya? 💘</h1>

  <div id="msg">
    I wrote code instead of sleeping for this 😭💻❤️
  </div>

  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 🙄</button>

</div>

<!-- RESULT -->
<div id="result">

  <h2>YOU SAID YES!!! 😍💘</h2>

  <p>
    My heart is yours 💞<br>
    Forever & Always 🥰🌹
  </p>

  <div class="hearts">💖 💕 💘 💗 💞</div>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card  = document.getElementById("card");
const result= document.getElementById("result");
const msg   = document.getElementById("msg");

const jokes = [
  "Waittt 😭",
  "Pleaseee 🥺",
  "Heyyy 😳",
  "Not fair 😂",
  "Stoppp 😵",
  "I’m panicking 😨",
  "Okay I surrender 😵‍💫"
];

let i = 0;

function moveNo(){

  const topSafe = 170;
  const bottomSafe = 130;

  const maxX = card.clientWidth - noBtn.offsetWidth;
  const maxY = card.clientHeight - noBtn.offsetHeight - bottomSafe;

  let x,y;

  do{
    x = Math.random()*maxX;
    y = Math.random()*(maxY - topSafe) + topSafe;
  }
  while(isOnYes(x,y));

  noBtn.style.left = x+"px";
  noBtn.style.top  = y+"px";

  noBtn.style.animation = "shake .3s";
  setTimeout(()=>noBtn.style.animation="",300);

  msg.textContent = jokes[i % jokes.length];
  i++;
}

function isOnYes(x,y){

  const yes = yesBtn.getBoundingClientRect();
  const cardBox = card.getBoundingClientRect();

  const noBox = {
    left: cardBox.left + x,
    top: cardBox.top + y,
    right: cardBox.left + x + noBtn.offsetWidth,
    bottom: cardBox.top + y + noBtn.offsetHeight
  };

  return !(
    noBox.right < yes.left ||
    noBox.left > yes.right ||
    noBox.bottom < yes.top ||
    noBox.top > yes.bottom
  );
}

noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("click",moveNo);
noBtn.addEventListener("touchstart",moveNo);

yesBtn.addEventListener("click",()=>{

  card.style.display="none";
  result.style.display="flex";

});

</script>

</body>
</html>
