<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Be My Valentine 💖</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

/* PAGE */
body{
  margin:0;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background-image: url("https://wallpapercave.com/wp/wp7351486.jpg");
  background-size: cover;
  background-position: center;

  font-family: 'Pacifico', cursive;
}

/* OVERLAY */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,0,80,0.25);
  z-index:-1;
}

/* CARD */
.container{
  width:90%;
  max-width:360px;
  aspect-ratio:1/1;

  background:rgba(255,245,250,0.95);

  border-radius:25px;

  box-shadow:
    0 0 25px rgba(255,0,80,.3),
    0 15px 35px rgba(0,0,0,.3);

  text-align:center;
  padding:22px;

  position:relative;
  overflow:hidden;

  border:3px solid #ff4d6d;
}

/* TEXT */
h1{
  color:#d90429;
  font-size:24px;
  margin:10px 0 5px;
}

.emoji{
  font-size:32px;
}

#msg{
  height:26px;
  font-size:14px;
  color:#7a001f;
  margin-bottom:15px;
}

/* BUTTONS */
button{
  all: unset;
  box-sizing:border-box;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:12px 24px;
  font-size:16px;

  border-radius:30px;
  cursor:pointer;

  position:absolute;
  transition:.25s;

  white-space:nowrap;
}

/* YES */
#yesBtn{
  background:linear-gradient(to right,#2ecc71,#27ae60);
  color:white;

  left:25px;
  bottom:20px;

  z-index:5;

  box-shadow:0 4px 10px rgba(0,0,0,.2);

  animation:pulse 1.5s infinite;
}

/* NO */
#noBtn{
  background:linear-gradient(to right,#ff4d6d,#ff1e56);
  color:white;

  min-width:90px;
  height:40px;

  right:25px;
  bottom:20px;

  z-index:2;

  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

/* PULSE */
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

/* SHAKE */
@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  50%{transform:translateX(5px);}
  75%{transform:translateX(-5px);}
  100%{transform:translateX(0);}
}

/* HEARTS */
.heart{
  position:fixed;
  font-size:22px;
  animation:rise 2s linear forwards;
  pointer-events:none;
}

@keyframes rise{
  from{opacity:1;transform:translateY(0);}
  to{opacity:0;transform:translateY(-120px) scale(1.5);}
}

/* CONFETTI */
@keyframes fall{
  to{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}

/* RESULT */
#result{
  position:fixed;
  inset:0;

  background:
    linear-gradient(135deg,#ffe0ec,#ffb3c6,#ff758f);

  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  text-align:center;
  padding:25px;
}

#result h2{
  color:#c9184a;
  font-size:32px;
}

#result p{
  font-size:18px;
  color:#800020;
}

/* 💍 RING IMAGE */
#ringPic{
  width:180px;
  height:180px;

  object-fit:cover;

  border-radius:50%;

  border:5px solid #ff4d6d;

  margin:15px 0;

  box-shadow:
    0 0 20px rgba(255,60,120,.6),
    0 8px 20px rgba(0,0,0,.3);

  animation:glow 2s infinite alternate;
}

/* RING GLOW */
@keyframes glow{
  from{
    box-shadow:
      0 0 15px rgba(255,80,130,.5),
      0 5px 15px rgba(0,0,0,.3);
  }
  to{
    box-shadow:
      0 0 30px rgba(255,120,170,.9),
      0 10px 25px rgba(0,0,0,.4);
  }
}

/* COUNTDOWN */
#countdown{
  margin-top:10px;
  font-size:20px;
  color:#b8002e;

  background:white;
  padding:10px 18px;
  border-radius:15px;

  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

/* MOBILE BOOST */
@media(max-width:480px){

  #ringPic{
    width:150px;
    height:150px;
  }

  h1{font-size:22px;}
  #msg{font-size:13px;}

  button{
    font-size:15px;
    padding:10px 20px;
  }

  #countdown{
    font-size:18px;
  }

}

</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" preload="auto" loop>
  <source src="ed_sheeran_perfect.mp3" type="audio/mpeg">
</audio>

<!-- CARD -->
<div class="container" id="card">

  <div class="emoji">🥺💖👉👈</div>

  <h1>Will you be my Valentine,<br>Priya? 💘</h1>

  <div id="msg">(I coded this with love 😭💻❤️)</div>

  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 🙄</button>

</div>

<!-- RESULT -->
<div id="result">
  <h2>Happy Valentines Day 💖</h2>
  <h2>FOREVER STARTS 😍💍</h2>

  <!-- 💍 RING IMAGE -->
  <img id="ringPic" src="ring.jpg" alt="Our Engagement Ring">

  <p>
    We’re getting married! 💞<br>
    April 23, 2026 💖
  </p>

  <div id="countdown">Loading...</div>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card  = document.getElementById("card");
const result= document.getElementById("result");
const msg   = document.getElementById("msg");
const music = document.getElementById("bgMusic");
const countdownEl = document.getElementById("countdown");

/* JOKES */
const jokes = [
  "Wait 😭",
  "Please 🥺",
  "Heyyy 😳",
  "Not fair 😂",
  "Stoppp 😵",
  "I’m scared 😨",
  "I surrender 😵‍💫"
];

let i = 0;

/* MOVE NO */
function moveNo(){

  const topSafe = 100;
  const bottomSafe = 80;

  const maxX = card.clientWidth - noBtn.offsetWidth;
  const maxY = card.clientHeight - noBtn.offsetHeight - bottomSafe;

  let x,y;

  do{
    x = Math.random()*maxX;
    y = Math.random()*(maxY - topSafe) + topSafe;
  }
  while(isOnYes(x,y));

  noBtn.style.left = x+"px";
  noBtn.style.top  = y+"px";

  noBtn.style.animation="shake .3s";
  setTimeout(()=>noBtn.style.animation="",300);

  msg.textContent = jokes[i % jokes.length];
  i++;
}

/* AVOID YES */
function isOnYes(x,y){

  const yes = yesBtn.getBoundingClientRect();
  const cardBox = card.getBoundingClientRect();

  const noBox = {
    left: cardBox.left + x,
    top: cardBox.top + y,
    right: cardBox.left + x + noBtn.offsetWidth,
    bottom: cardBox.top + y + noBtn.offsetHeight
  };

  return !(
    noBox.right < yes.left ||
    noBox.left > yes.right ||
    noBox.bottom < yes.top ||
    noBox.top > yes.bottom
  );
}

/* EVENTS */
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("click",moveNo);
noBtn.addEventListener("touchstart",moveNo);

/* MUSIC */
let musicStarted=false;

function startMusic(){
  if(musicStarted) return;
  music.play().catch(()=>{});
  musicStarted=true;
}

document.addEventListener("click",startMusic);
document.addEventListener("touchstart",startMusic);

/* YES CLICK */
yesBtn.addEventListener("click",()=>{

  card.style.display="none";
  result.style.display="flex";

  startCountdown();
});

/* 💍 COUNTDOWN */
function startCountdown(){

  // April 23, 2026
  const weddingDate = new Date("2026-04-23T00:00:00").getTime();

  setInterval(()=>{

    const now = new Date().getTime();
    const diff = weddingDate - now;

    if(diff<=0){
      countdownEl.textContent="💍 TODAY IS THE DAY!!! 💖";
      return;
    }

    const days = Math.floor(diff/(1000*60*60*24));
    const hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    const mins = Math.floor((diff%(1000*60*60))/(1000*60));
    const secs = Math.floor((diff%(1000*60))/1000);

    countdownEl.textContent =
      `${days} Days ${hours}h ${mins}m ${secs}s 💞`;

  },1000);

}

</script>

</body>
</html>
