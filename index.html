<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Be My Valentine 💖</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>

/* PAGE */
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;

  background-image: url("https://wallpapercave.com/wp/wp7351486.jpg");
  background-size: cover;
  background-position: center;

  font-family: 'Pacifico', cursive;
}

/* OVERLAY */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,0,80,0.25);
  z-index:-1;
}

/* CARD */
.container{
  width:360px;
  height:360px;

  background:rgba(255,245,250,0.95);

  border-radius:25px;

  box-shadow:
    0 0 25px rgba(255,0,80,.3),
    0 15px 35px rgba(0,0,0,.3);

  text-align:center;
  padding:25px;
  position:relative;
  overflow:hidden;

  border:3px solid #ff4d6d;
}

/* TEXT */
h1{
  color:#d90429;
  font-size:26px;
  margin-top:15px;
  margin-bottom:8px;
}

.emoji{
  font-size:34px;
  margin-bottom:5px;
}

#msg{
  height:26px;
  font-size:15px;
  color:#7a001f;
  margin-bottom:20px;
}

/* BUTTON RESET */
button{
  all: unset;
  box-sizing: border-box;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 12px 26px;
  font-size: 17px;
  font-family: inherit;

  border-radius: 30px;
  cursor: pointer;

  position: absolute;
  transition: .25s;

  white-space: nowrap;
}

/* YES */
#yesBtn{
  background:linear-gradient(to right,#2ecc71,#27ae60);
  color:white;

  left:35px;
  bottom:25px;

  z-index:5;

  box-shadow:0 4px 10px rgba(0,0,0,.2);

  animation:pulse 1.5s infinite;
}

/* YES PULSE */
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

/* NO */
#noBtn{
  background:linear-gradient(to right,#ff4d6d,#ff1e56);
  color:white;

  min-width:95px;
  height:44px;

  right:35px;
  bottom:25px;

  z-index:2;

  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

/* SHAKE */
@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  50%{transform:translateX(5px);}
  75%{transform:translateX(-5px);}
  100%{transform:translateX(0);}
}

/* HEARTS */
.heart{
  position:fixed;
  font-size:22px;
  animation:rise 2s linear forwards;
  pointer-events:none;
}

@keyframes rise{
  from{
    transform:translateY(0) scale(1);
    opacity:1;
  }
  to{
    transform:translateY(-120px) scale(1.5);
    opacity:0;
  }
}

/* CONFETTI */
@keyframes fall{
  to{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}

/* RESULT */
#result{
  position:fixed;
  inset:0;

  background:
    linear-gradient(135deg,#ffe0ec,#ffb3c6,#ff758f);

  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  text-align:center;
  padding:20px;
}

#result h2{
  color:#c9184a;
  font-size:34px;
}

#result p{
  font-size:20px;
  color:#800020;
}

.hearts{
  font-size:40px;
  margin-top:10px;
  animation:float 2s infinite alternate;
}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-15px);}
}

</style>
</head>

<body>

<!-- 🎵 BACKGROUND MUSIC -->
<iframe
  width="0"
  height="0"
  src="https://www.youtube.com/embed/2Vv-BfVoq4g?start=21&autoplay=1&loop=1&playlist=2Vv-BfVoq4g"
  frameborder="0"
  allow="autoplay"
></iframe>

<!-- CARD -->
<div class="container" id="card">

  <div class="emoji">🥺💖👉👈</div>

  <h1>Will you be my Valentine,<br>Priya? 💘</h1>

  <div id="msg">(I wrote code instead of sleeping 😭💻❤️)</div>

  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 🙄</button>

</div>

<!-- RESULT -->
<div id="result">

  <h2>YOU SAID YES!!! 😍💘</h2>

  <p>
    My heart is yours 💞<br>
    Happy Valentine’s Day 🥰🌹
  </p>

  <div class="hearts">💖 💕 💘 💗 💞</div>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card  = document.getElementById("card");
const result= document.getElementById("result");
const msg   = document.getElementById("msg");

/* FUNNY TEXT */
const jokes = [
  "Waittt 😭",
  "Pleaseee 🥺",
  "Heyyy 😳",
  "Not fair 😂",
  "Stoppp 😵",
  "I’m panicking 😨",
  "Okay I surrender 😵‍💫"
];

let i = 0;

/* MOVE NO */
function moveNo(){

  const topSafe = 110;
  const bottomSafe = 90;

  const maxX = card.clientWidth - noBtn.offsetWidth;
  const maxY = card.clientHeight - noBtn.offsetHeight - bottomSafe;

  let x,y;

  do{
    x = Math.random()*maxX;
    y = Math.random()*(maxY - topSafe) + topSafe;
  }
  while(isOnYes(x,y));

  noBtn.style.left = x+"px";
  noBtn.style.top  = y+"px";

  noBtn.style.animation = "shake .3s";
  setTimeout(()=>noBtn.style.animation="",300);

  msg.textContent = jokes[i % jokes.length];
  i++;
}

/* AVOID YES */
function isOnYes(x,y){

  const yes = yesBtn.getBoundingClientRect();
  const cardBox = card.getBoundingClientRect();

  const noBox = {
    left: cardBox.left + x,
    top: cardBox.top + y,
    right: cardBox.left + x + noBtn.offsetWidth,
    bottom: cardBox.top + y + noBtn.offsetHeight
  };

  return !(
    noBox.right < yes.left ||
    noBox.left > yes.right ||
    noBox.bottom < yes.top ||
    noBox.top > yes.bottom
  );
}

/* EVENTS */
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("click",moveNo);
noBtn.addEventListener("touchstart",moveNo);

/* HEARTS ON YES */
yesBtn.addEventListener("mouseover",()=>{

  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "💖";

  heart.style.left = Math.random()*window.innerWidth+"px";
  heart.style.bottom = "30px";

  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),2000);

});

/* YES CLICK */
yesBtn.addEventListener("click",()=>{

  // Confetti
  for(let i=0;i<40;i++){

    const conf = document.createElement("div");

    conf.textContent = ["💖","🌹","💘","💕"][Math.floor(Math.random()*4)];

    conf.style.position="fixed";
    conf.style.left=Math.random()*100+"%";
    conf.style.top="-20px";
    conf.style.fontSize="24px";
    conf.style.animation="fall 2s linear";

    document.body.appendChild(conf);

    setTimeout(()=>conf.remove(),2000);
  }

  card.style.display="none";
  result.style.display="flex";

});

</script>

</body>
</html>
