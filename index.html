<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💘</title>

  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: "Comic Sans MS", cursive, sans-serif;
    }

    .container {
      background: white;
      padding: 35px 25px;
      border-radius: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      width: 330px;
      height: 320px;
      position: relative;
      animation: pop 0.8s ease;
      overflow: hidden;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #ff4081;
      margin-bottom: 5px;
    }

    .emoji {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .message {
      font-size: 14px;
      color: #666;
      height: 22px;
      margin-bottom: 20px;
      transition: 0.3s;
    }

    button {
      padding: 12px 26px;
      font-size: 18px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      position: absolute;
      transition: 0.25s ease;
      user-select: none;
    }

    /* YES BUTTON */
    #yesBtn {
      background: #4CAF50;
      color: white;
      left: 40px;
      bottom: 25px;
      z-index: 10;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* NO BUTTON */
    #noBtn {
      background: #ff4d6d;
      color: white;
      right: 40px;
      bottom: 25px;
      z-index: 1;
    }

    /* CELEBRATION */
    .celebrate {
      position: fixed;
      inset: 0;
      background: #fff0f6;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      font-size: 26px;
      padding: 20px;
    }

    .celebrate h2 {
      color: #ff4081;
      margin-bottom: 10px;
    }

    .hearts {
      font-size: 40px;
      animation: float 2s infinite alternate;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-15px); }
    }
  </style>
</head>

<body>

  <!-- MAIN CARD -->
  <div class="container" id="card">

    <div class="emoji">🥺👉👈</div>

    <h1>Will you be my Valentine Priyaaaaaaaa ?</h1>

    <div class="message" id="msg">
      (You know the answer 😌💖)
    </div>

    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 🙄</button>

  </div>

  <!-- CELEBRATION SCREEN -->
  <div class="celebrate" id="celebration">

    <h2>OMG YOU SAID YES!!! 😍💘</h2>

    <p>
      Best decision ever 🥰💐<br><br>
      Happy Valentine’s Day 💝
    </p>

    <div class="hearts">💖 💘 💕 💞 💗</div>

  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const container = document.getElementById("card");
    const msg = document.getElementById("msg");
    const celebration = document.getElementById("celebration");

    const funnyTexts = [
      "Too slow 😂",
      "Nice try 😏",
      "Nope 😜",
      "Almost 😎",
      "Try again 😘",
      "Not happening 😌",
      "Hehe 🤭"
    ];

    let counter = 0;

    function moveNo() {
      const maxX = container.clientWidth - noBtn.offsetWidth;
      const maxY = container.clientHeight - noBtn.offsetHeight - 70;

      let x, y, isOverlapping;

      do {
        x = Math.random() * maxX;
        y = Math.random() * maxY;

        isOverlapping = checkOverlap(x, y);

      } while (isOverlapping);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      msg.textContent = funnyTexts[counter % funnyTexts.length];
      counter++;
    }

    function checkOverlap(x, y) {
      const yesRect = yesBtn.getBoundingClientRect();
      const contRect = container.getBoundingClientRect();

      const noRect = {
        left: contRect.left + x,
        top: contRect.top + y,
        right: contRect.left + x + noBtn.offsetWidth,
        bottom: contRect.top + y + noBtn.offsetHeight
      };

      return !(
        noRect.right < yesRect.left ||
        noRect.left > yesRect.right ||
        noRect.bottom < yesRect.top ||
        noRect.top > yesRect.bottom
      );
    }

    // Desktop
    noBtn.addEventListener("mouseover", moveNo);

    // Mobile
    noBtn.addEventListener("touchstart", moveNo);

    // Click safety
    noBtn.addEventListener("click", moveNo);

    // YES CLICK
    yesBtn.addEventListener("click", () => {
      card.style.display = "none";
      celebration.style.display = "flex";
    });
  </script>

</body>
</html>
