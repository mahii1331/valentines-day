<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Be My Valentine 💖</title>

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family:"Comic Sans MS",cursive;
}

/* CARD */
.container{
  width:340px;
  height:330px;
  background:white;
  border-radius:25px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  text-align:center;
  padding:25px;
  position:relative;
  overflow:hidden;
}

/* TEXT */
h1{
  color:#ff4081;
  font-size:24px;
  margin-bottom:10px;
}

.emoji{
  font-size:38px;
}

#msg{
  height:20px;
  font-size:14px;
  color:#777;
  margin-bottom:20px;
}

/* BUTTONS */
button{
  border:none;
  padding:12px 26px;
  font-size:17px;
  border-radius:40px;
  cursor:pointer;
  position:absolute;
  transition:.2s;
}

/* YES FIXED */
#yesBtn{
  background:#4CAF50;
  color:white;
  left:35px;
  bottom:25px;
  z-index:5;
}

/* NO FLOATING */
#noBtn{
  background:#ff4d6d;
  color:white;
  right:35px;
  bottom:25px;
  z-index:2;
}

/* RESULT */
#result{
  position:fixed;
  inset:0;
  background:#fff0f6;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

#result h2{
  color:#ff4081;
}

</style>
</head>

<body>

<!-- MAIN CARD -->
<div class="container" id="card">

  <div class="emoji">🥺👉👈</div>

  <h1>Will you be my Valentine, Priyaa? 💘</h1>

  <div id="msg">(You know the answer 😌)</div>

  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 🙄</button>

</div>

<!-- RESULT -->
<div id="result">

  <h2>YAYYY 😍💘</h2>

  <p>You said YES!!!<br>Best decision ever 🥰</p>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card  = document.getElementById("card");
const msg   = document.getElementById("msg");
const result= document.getElementById("result");

const jokes = [
  "Nice try 😂",
  "Too slow 😏",
  "Almost 😜",
  "Nope 😎",
  "Try again 😘",
  "Hehe 🤭"
];

let i = 0;

/* MOVE NO */
function moveNo(){

  const maxX = card.clientWidth  - noBtn.offsetWidth;
  const maxY = card.clientHeight - noBtn.offsetHeight - 70;

  let x,y;

  do{
    x = Math.random()*maxX;
    y = Math.random()*maxY;
  }
  while(isOnYes(x,y));

  noBtn.style.left = x+"px";
  noBtn.style.top  = y+"px";

  msg.textContent = jokes[i % jokes.length];
  i++;
}

/* PREVENT OVERLAP */
function isOnYes(x,y){

  const yes = yesBtn.getBoundingClientRect();
  const cardBox = card.getBoundingClientRect();

  const noBox = {
    left: cardBox.left + x,
    top: cardBox.top + y,
    right: cardBox.left + x + noBtn.offsetWidth,
    bottom: cardBox.top + y + noBtn.offsetHeight
  };

  return !(
    noBox.right < yes.left ||
    noBox.left > yes.right ||
    noBox.bottom < yes.top ||
    noBox.top > yes.bottom
  );
}

/* EVENTS */
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("click",moveNo);
noBtn.addEventListener("touchstart",moveNo);

yesBtn.addEventListener("click",()=>{

  card.style.display="none";
  result.style.display="flex";

});

</script>

</body>
</html>
